<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hardware Monitor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div>
        <h1 data-i18n="AppName">Hardware Monitor</h1>
        <p class="meta" id="metaLine" data-i18n="WebPreparing">Live sampling · Preparing…</p>
      </div>
      <div class="top-actions">
        <div class="seg" id="sizeSeg">
          <button type="button" data-size="compact" data-i18n="Compact">Compact</button>
          <button type="button" data-size="default" class="active" data-i18n="Default">Default</button>
        </div>
        <button type="button" class="btn" id="stressBtn" data-i18n="Stress">Simulate stress</button>
        <button type="button" class="btn" id="pauseBtn" data-i18n="Pause">Pause</button>
      </div>
    </header>

    <section class="kpis" id="kpis"></section>

    <section class="stage">
      <aside class="panel">
        <div class="panel-h">
          <h2 data-i18n="DockHeading">Command Palette · Dock</h2>
          <span id="dockMode">Default</span>
        </div>
        <div class="dock-wrap">
          <div class="dock" id="dock"></div>
        </div>
        <div class="panel-h" style="margin-top:8px">
          <h2 data-i18n="AllReadings">All readings</h2>
          <span id="listCount">0</span>
        </div>
        <div class="list" id="sensorList"></div>
      </aside>

      <main class="panel">
        <div class="panel-h">
          <h2 id="chartTitle" data-i18n="CpuPackageTemperature">CPU package temperature</h2>
          <span id="chartStats">—</span>
        </div>
        <div class="chart-block">
          <canvas id="mainChart" width="720" height="240"></canvas>
        </div>
        <div class="legend" id="chartLegend"></div>

        <div class="grid-2" id="miniGrid">
          <article class="mini">
            <header><h3>CPU</h3><span id="cpuNow">—</span></header>
            <canvas id="cpuMini" width="360" height="110"></canvas>
            <div class="rows" id="cpuRows"></div>
          </article>
          <article class="mini">
            <header><h3>GPU</h3><span id="gpuNow">—</span></header>
            <canvas id="gpuMini" width="360" height="110"></canvas>
            <div class="rows" id="gpuRows"></div>
          </article>
          <article class="mini">
            <header><h3 data-i18n="GroupStorage">Storage</h3><span id="diskNow">—</span></header>
            <canvas id="diskMini" width="360" height="110"></canvas>
            <div class="rows" id="diskRows"></div>
          </article>
          <article class="mini">
            <header><h3 data-i18n="MiscHeading">Motherboard / Fans / Memory</h3><span id="miscNow">—</span></header>
            <canvas id="miscMini" width="360" height="110"></canvas>
            <div class="rows" id="miscRows"></div>
          </article>
        </div>
      </main>
    </section>

    <section class="panel table-panel">
      <div class="panel-h">
        <h2 data-i18n="DetailsTable">Details</h2>
        <span id="tableFilterNote" data-i18n="SelectRowHint">Select a row to change the main chart</span>
      </div>
      <div class="table-wrap">
        <table id="dataTable">
          <thead>
            <tr>
              <th data-i18n="Metric">Metric</th><th data-i18n="Group">Group</th><th data-i18n="Kind">Type</th><th data-i18n="CurrentValue">Current value</th><th data-i18n="Source">Source</th><th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="i18n-data.js"></script>
  <script src="i18n.js"></script>
  <script src="live-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
